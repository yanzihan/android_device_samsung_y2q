# Runtime configuration for Broadcom libbt-vendor on y2q.
#
# This is the file the vendor library reads at run time.  Its syntax is NOT the
# same as libbt_vndcfg.txt next to it:
#
#   * libbt_vndcfg.txt is consumed at BUILD time by hardware/broadcom/libbt's
#     gen-buildcfg.sh, which turns each line into a C #define.  There the names
#     are the library's macro names (BLUETOOTH_UART_DEVICE_PORT, ...) and the
#     values must be quoted so they become C string literals.
#
#   * this file is parsed at RUN time by conf.c, which only knows the handful of
#     keys in its conf_table (hardware/broadcom/libbt/src/conf.c:72-83):
#         UartPort, FwPatchFilePath, FwPatchFileName, FwPrePatchFileName,
#         UartForceUse2StopBits
#     Any other name is silently ignored - which is exactly what happened while
#     the build-time names were used here: the library kept its built-in default
#     and tried to open /dev/ttyO1.
#
#   * values must NOT be quoted.  conf.c does not strip quotes, so
#     UartPort = "/dev/ttyHS0" makes the library call open("\"/dev/ttyHS0\"")
#     and fail with ENOENT on a path that has literal quote characters in it.
#
# The file is installed to /vendor/etc/bluetooth/bt_vendor.conf, which is the
# path libbt_vndcfg.txt points VENDOR_LIB_CONF_FILE at.  That location is
# labelled vendor_configs_file, so hal_bluetooth_default may read it; the
# library's own fallback path /etc/bluetooth/bt_vendor.conf resolves to
# /system/etc/, whose system_file label the Bluetooth HAL domain is not allowed
# to read (verified with an avc denial).

# BCM4375 on y2q is wired to qupv3_se6_4uart, which msm_geni_serial registers as
# /dev/ttyHS0.  Do not copy y2s's /dev/ttySAC1 - that tree is Exynos.
UartPort = /dev/ttyHS0

# Where the controller firmware lives, and which file to load.  Naming it
# explicitly avoids relying on conf.c's directory scan, which matches the .hcd by
# chip-id prefix and is case sensitive.
FwPatchFilePath = /vendor/firmware/
FwPatchFileName = bcm4375B1_murata.hcd
