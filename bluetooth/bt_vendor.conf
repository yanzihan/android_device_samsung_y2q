# Runtime configuration for libbt-vendor.  Read by conf.c, which only knows the
# keys in its conf_table: UartPort, FwPatchFilePath, FwPatchFileName,
# FwPrePatchFileName, UartForceUse2StopBits.  Anything else is silently ignored.
#
# Two things differ from libbt_vndcfg.txt next to it, which is the BUILD-time file:
# values here must not be quoted (conf.c does not strip quotes), and the names are
# conf.c's keys rather than the library's macro names.
#
# Installed to /vendor/etc/bluetooth/ so it carries a label the Bluetooth HAL
# domain may read; the library's own default path resolves to /system/etc.

# msm_geni_serial registers the BCM4375's UART as /dev/ttyHS0.
UartPort = /dev/ttyHS0

FwPatchFilePath = /vendor/firmware/
FwPatchFileName = bcm4375B1_murata.hcd
