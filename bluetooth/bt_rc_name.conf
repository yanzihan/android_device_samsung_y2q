# Remote-control device names, read by com.android.bluetooth.
#
# RemoteDevices.java (packages/modules/Bluetooth/android/app/src/com/android/
# bluetooth/btservice/RemoteDevices.java:87) loads this file in a STATIC
# initialiser:
#
#     private static final String RC_NAMES_FILE =
#             "/vendor/etc/bluetooth/bt_rc_name.conf";
#     private static final Set<String> REMOTE_CONTROL_NAMES = loadRemoteControlNames();
#
# and loadRemoteControlNames() only catches IOException to log "No remote-control
# name configuration".  A missing file therefore throws out of the static
# initialiser as ExceptionInInitializerError, RemoteDevices fails to load, and
# because AdapterService.onCreate() touches RemoteDevices the whole Bluetooth
# process aborts:
#
#     ENOENT (No such file or directory)
#       at ...RemoteDevices.loadRemoteControlNames(RemoteDevices.java:96)
#       at ...RemoteDevices.<clinit>(RemoteDevices.java:92)
#       at ...AdapterService.onCreate(AdapterService.java:684)
#     Fatal signal 6 (SIGABRT) ... droid.bluetooth
#     Scheduling restart of crashed service com.android.bluetooth/.btservice.AdapterService
#     Reached maximum retry to restart Bluetooth!
#
# The format is one "key=value" per line; a line without '=' is skipped, and the
# value is the human-readable name kept for that device.  RcCount is reserved.
# y2q ships no curated list, so this file only has to exist; adding real entries
# is cosmetic and only affects how peripherals are labelled in the UI.
RcCount=0
